<!doctype html>
<html lang="es"><head>

<style>
:root{--bg:#f4f7f6;--surface:#fff;--ink:#123b33;--muted:#5b6b66;--line:#d7e0dc;--brand:#008f86;--brand-deep:#007d70;--accent:#f17822;--accent-ink:#1b0e04;--ok:#1d7a3a;--okbg:#e6f4ea;--bad:#b3261e;--badbg:#fbe9e7;--warn:#8a5a00;--warnbg:#fff4dc;--fab:#5b6b66}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--surface:#1a2220;--ink:#e6efec;--muted:#a3b3ae;--line:#33423e;--brand:#2bb5a9;--brand-deep:#5fd0c4;--accent:#f58a3c;--ok:#7fd49a;--okbg:#17301f;--bad:#ff8a80;--badbg:#3a1a17;--warn:#f5c26b;--warnbg:#33290f;--fab:#a3b3ae}}
:root[data-theme="dark"]{--bg:#121816;--surface:#1a2220;--ink:#e6efec;--muted:#a3b3ae;--line:#33423e;--brand:#2bb5a9;--brand-deep:#5fd0c4;--accent:#f58a3c;--ok:#7fd49a;--okbg:#17301f;--bad:#ff8a80;--badbg:#3a1a17;--warn:#f5c26b;--warnbg:#33290f;--fab:#a3b3ae}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:3px solid var(--accent);display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
header img{width:36px;height:36px;border-radius:8px}
header .t{flex:1;min-width:0}header b{display:block;color:var(--brand-deep);font-size:1.05rem}
header small{color:var(--muted);font-size:.78rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ver{font:600 .7rem ui-monospace,monospace;background:var(--accent);color:var(--accent-ink);padding:1px 5px;border-radius:4px;margin-left:4px}
main{padding:12px 12px 96px;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;color:var(--muted);font:600 .8rem system-ui,sans-serif;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
nav button .i{font-size:1.3rem;line-height:1}nav button[aria-current="page"]{color:var(--brand-deep);box-shadow:inset 0 3px 0 var(--brand)}
nav .cnt{position:absolute;top:6px;right:calc(50% - 26px);background:var(--accent);color:var(--accent-ink);border-radius:9px;font-size:.7rem;padding:0 5px;min-width:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
h2{font-size:1.1rem;margin:0 0 8px}h3{font-size:1rem;margin:12px 0 6px}
.muted{color:var(--muted);font-size:.88rem}
button,.btn{font:inherit;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer}
.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.big{width:100%;min-height:56px;font-size:1.05rem}
.sec{border-color:var(--brand);color:var(--brand-deep);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.85rem;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:8px 10px;width:100%}
textarea{min-height:64px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--brand);outline-offset:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.span2{grid-column:1/-1}
.list{display:flex;flex-direction:column;gap:6px}
.eq{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:56px;text-align:left;width:100%}
.eq img,.eq .ph{width:44px;height:44px;border-radius:6px;object-fit:cover;flex:none;background:var(--bg);border:1px solid var(--line)}
.eq .m{flex:1;min-width:0}.eq .m div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code{font:700 .95rem ui-monospace,Menlo,monospace}
.tag{display:inline-block;font-size:.75rem;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted);margin-right:4px}
.tag.ok{background:var(--okbg);color:var(--ok);border-color:transparent}.tag.bad{background:var(--badbg);color:var(--bad);border-color:transparent}.tag.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.note{border-left:5px solid var(--brand);background:var(--surface);border-radius:8px;padding:10px 12px;font-size:.92rem}
.note.bad{border-color:var(--bad);background:var(--badbg)}.note.ok{border-color:var(--ok);background:var(--okbg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{flex:none;min-height:40px;padding:6px 12px;border-radius:20px;font-size:.9rem}
.chips button[aria-pressed="true"]{background:var(--brand-deep);border-color:var(--brand-deep);color:#fff}
.chk{border-top:1px solid var(--line);padding:8px 0}.chk:first-child{border-top:0}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}.tri button{min-height:44px;padding:4px}
.tri button[aria-pressed="true"][data-v="OK"]{background:var(--okbg);color:var(--ok);border-color:var(--ok);font-weight:700}
.tri button[aria-pressed="true"][data-v="Defecto"]{background:var(--badbg);color:var(--bad);border-color:var(--bad);font-weight:700}
.tri button[aria-pressed="true"][data-v="N/A"]{background:var(--bg);border-color:var(--ink);font-weight:700}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.thumbs figure{margin:0;position:relative}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.thumbs figcaption{font-size:.68rem;color:var(--muted);max-width:76px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.thumbs .x{position:absolute;top:-6px;right:-6px;min-height:28px;width:28px;padding:0;border-radius:14px;background:var(--bad);color:#fff;border:0;font-weight:700}
.big-photo{width:100%;max-height:300px;object-fit:contain;border-radius:8px;background:var(--bg)}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:.92rem}dt{color:var(--muted)}dd{margin:0}
.toast{position:fixed;left:12px;right:12px;bottom:76px;z-index:9;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:10px;font-weight:600;text-align:center}
.it{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:8px 0}.it:first-child{border-top:0}.it .m{flex:1;min-width:0}
.mvitem{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:4px 0;min-height:48px}
.mvitem input[type=checkbox]{width:24px;height:24px;min-height:0;flex:none}
.back{align-self:flex-start}
</style>
</head><body>
<header><img src="icon-192.png" alt=""><div class="t"><b>Izado <span class="ver" id="ver"></span></b><small id="hdDatos">Sin datos cargados</small></div><button id="btnDatos" class="sec" title="Cargar archivo de datos nuevo">⟳ Datos</button></header>
<main id="app"></main>
<nav id="nav" hidden>
  <button data-tab="equipos"><span class="i">🔍</span>Equipos</button>
  <button data-tab="alta"><span class="i">📷</span>Alta</button>
  <button data-tab="mover"><span class="i">⇄</span>Mover</button>
  <button data-tab="enviar"><span class="i">📤</span>Enviar<span class="cnt" id="cntPend" hidden></span></button>
</nav>
<input type="file" id="inDatos" hidden>
<input type="file" id="inFoto" accept="image/*" capture="environment" hidden>
<script>
"use strict";
const PROGRAMA="V12", BUILD="V12-3";
const CORREO_PRL="prevencion.milsa@milsatrillo.com", REPO_DEF="ALD1978/Izado-datos", DATOS_PATH="datos/Izado-datos-movil.json";
document.getElementById("ver").textContent=PROGRAMA;

/* ---------- Tipos y comprobaciones (igual que la app de claude.ai) ---------- */
const TIPOS={"Eslinga textil de banda":"textil","Eslinga textil redonda":"textil","Eslinga de cadena":"cadena","Eslinga de cable":"cable","Grillete":"grillete","Cáncamo giratorio":"cancamo","Cáncamo fijo / argolla":"cancamo","Gancho":"gancho","Anilla / eslabón maestro":"gancho","Balancín / pórtico":"estructura","Garra / pinza":"estructura","Tensor / tráctel":"otro","Otro accesorio":"otro"};
const CHECK={
  comun:["Código presente y legible (placa Milsa, ON!Track o etiqueta)","Marcado del fabricante, CMU y CE legibles"],
  cadena:["Sin eslabones deformados, fisurados, con muescas o soldaduras","Alargamiento de la cadena menor del 5 %","Desgaste del diámetro menor del 10 %","Ganchos sin apertura de boca (>10 %) y con pestillo","Anilla maestra y acortadores sin deformación","Sin corrosión grave ni señales de calor"],
  textil:["Etiqueta presente y legible (sin etiqueta: retirar)","Sin cortes, desgarros ni costuras rotas","Sin abrasión fuerte, fibras fundidas ni quemaduras","Sin daños químicos (decoloración, rigidez)","Gazas / ojales en buen estado","Redonda: la funda no deja ver el núcleo"],
  cable:["Hilos rotos por debajo del límite de UNE-EN 13414-2","Sin aplastamientos, cocas ni «jaula de pájaro»","Sin corrosión ni falta de engrase","Casquillos y terminales sin fisuras ni deslizamiento","Guardacabos en su sitio"],
  grillete:["Cuerpo sin deformación ni apertura","Bulón original, recto y rosca hasta el fondo","Pasador o tuerca de seguridad (si lo lleva)","Desgaste de cuerpo y bulón menor del 10 %","Sin fisuras, soldaduras ni calentamientos"],
  cancamo:["Rosca sin daños y con la longitud de la ficha","Gira 360° y abate sin bloqueos (giratorio)","Anilla sin deformación ni desgaste >10 %","Tornillo con la calidad y marcado de la ficha","Asiento plano y par de apriete según ficha"],
  gancho:["Apertura de boca no aumentada (>10 %)","Pestillo de seguridad funciona","Sin torsión ni fisuras","Desgaste del asiento menor del 10 %"],
  estructura:["Estructura sin deformación ni fisuras en soldaduras","Mecanismo de cierre o apriete funciona","Placa con CMU y peso propio","Pernos, pasadores y seguros completos"],
  otro:["Sin deformaciones, fisuras ni desgaste apreciable","Funciona según el manual del fabricante"]};
const COLOR_TEXTIL=[[1,"Violeta"],[2,"Verde"],[3,"Amarillo"],[4,"Gris"],[5,"Rojo"],[6,"Marrón"],[8,"Azul"],[10,"Naranja"]];
const NAVE="NAVE", BAJA="BAJA";

/* ---------- Utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const hoy=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const hora=()=>{const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fd=s=>s?s.split("-").reverse().join("/"):"—";
const num=v=>{const n=parseFloat(String(v??"").replace(",","."));return isFinite(n)?n:null};
const fnum=n=>n==null?"":String(n).replace(".",",");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function normCode(s){
  s=String(s||"").toUpperCase().replace(/[​-‍﻿]/g,"").replace(/\s+/g," ").trim();
  let m=s.match(/^(GLL|CC|TN)[\s.\-_]*0*(\d{1,5})$/); if(m) return `${m[1]}-${m[2].padStart(5,"0")}`;
  m=s.match(/^EE[\s\-]*0*(\d{1,5})([A-Z]?)$/); if(m) return `EE-${m[1].padStart(3,"0")}${m[2]}`;
  return s.replace(/\s+/g,"-");
}
function colorTextil(cmu){const r=COLOR_TEXTIL.find(c=>c[0]===cmu);return r?r[1]:""}
function toast(t,ms=2600){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),ms)}

/* ---------- IndexedDB ---------- */
let _db;
function idb(){return _db||(_db=new Promise((ok,ko)=>{const r=indexedDB.open("izado-movil",1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("kv");d.createObjectStore("items",{keyPath:"id"})};r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)}))}
async function tx(store,mode,fn){const d=await idb();return new Promise((ok,ko)=>{const t=d.transaction(store,mode);const s=t.objectStore(store);const r=fn(s);t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>ko(t.error)})}
const kvGet=k=>tx("kv","readonly",s=>s.get(k)), kvSet=(k,v)=>tx("kv","readwrite",s=>s.put(v,k));
const itemsAll=()=>tx("items","readonly",s=>s.getAll()), itemPut=v=>tx("items","readwrite",s=>s.put(v)), itemDel=id=>tx("items","readwrite",s=>s.delete(id));

/* ---------- Estado ---------- */
const S={datos:null,items:[],tab:"equipos",q:"",fUb:"",eq:new Map(),draft:null};
function ubicName(u){if(!u||u===NAVE)return "Nave";if(u===BAJA)return "Baja";const o=(S.datos.obras||[]).find(o=>o.id===u);return o?o.nombre:u}
function ubicaciones(){return [[NAVE,"Nave"],...(S.datos.obras||[]).map(o=>[o.id,o.nombre]),[BAJA,"Baja"]]}
function rebuild(){
  // Equipos de los datos + lo hecho en el móvil (altas, movimientos, revisiones)
  S.eq=new Map();
  for(const e of S.datos.equipos) S.eq.set(e.c,{...e});
  const inc=new Set(S.datos.incluye||[]);
  const rem=(S.remotos||[]).filter(r=>!inc.has(r.name)).flatMap(r=>r.items.map(i=>({...i,remoto:r.movil||"otro móvil"})));
  const its=[...S.items.filter(i=>!(i.envio&&inc.has(i.envio))),...rem].sort((a,b)=>(a.ts||0)-(b.ts||0));
  for(const it of its){
    if(it.clase==="alta"&&it.codigo){S.eq.set(it.codigo,{c:it.codigo,t:it.tipo,d:it.descripcion,cmu:it.cmu,l:it.longitud,mat:it.material,m:it.marca,ub:it.ubicacion,est:"Pendiente de revisar",serie:it.serie,nuevo:true,mini:(it.fotos||[])[0]&&it.fotos[0].mini})}
    if(it.clase==="movimiento") for(const c of it.equipos){const e=S.eq.get(c);if(e)e.ub=it.a}
    if(it.clase==="revision"){const e=S.eq.get(it.equipo);if(e){e.est=it.resultado;e.ult=it.fecha;e.prox=null;e.revMovil=true}}
  }
  const p=S.items.filter(i=>!i.enviado).length, b=$("#cntPend");b.hidden=!p;b.textContent=p;
}
async function cargarItems(){S.items=await itemsAll();try{S.remotos=(await kvGet("remotos"))||[]}catch(e){S.remotos=[]}rebuild()}

/* ---------- Fotos ---------- */
function pedirFoto(){return new Promise(ok=>{const i=$("#inFoto");i.value="";i.onchange=()=>ok(i.files[0]||null);i.click()})}
async function reducir(file,max=1600,q=.82){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((ok,ko)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=ko;im.src=url});
    const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);const data=c.toDataURL("image/jpeg",q);
    const s2=Math.min(1,160/Math.max(img.width,img.height));const c2=document.createElement("canvas");c2.width=Math.round(img.width*s2);c2.height=Math.round(img.height*s2);c2.getContext("2d").drawImage(img,0,0,c2.width,c2.height);
    return {data,mini:c2.toDataURL("image/jpeg",.7)}}
  finally{URL.revokeObjectURL(url)}
}
async function nuevaFoto(tag){const f=await pedirFoto();if(!f)return null;const r=await reducir(f);return {tag,hora:`${hoy()} ${hora()}`,...r}}
function thumbs(fotos,delAttr){return `<div class="thumbs">${fotos.map((f,i)=>`<figure><img src="${f.mini||f.data}" alt="${esc(f.tag)}">${delAttr?`<button class="x" ${delAttr}="${i}" aria-label="Quitar foto">×</button>`:""}<figcaption>${esc(f.tag)}</figcaption></figure>`).join("")}</div>`}

/* ---------- Carga de datos ---------- */
$("#btnDatos").onclick=()=>{if(gh())return sincronizar(false);$("#inDatos").value="";$("#inDatos").click()};
$("#inDatos").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());
    if(d.formato!=="izado-datos-movil"||!Array.isArray(d.equipos)) throw new Error("No es un archivo de datos de Izado.");
    await kvSet("datos",d);S.datos=d;await cargarItems();hdr();
    toast(`Datos cargados: ${d.equipos.length} equipos (${fd(d.fecha)})`);
    if(d.programa&&d.programa!==PROGRAMA) toast(`Los datos son de la ${d.programa} y el programa es la ${PROGRAMA}. Pide el archivo de esta versión.`,6000);
    go("equipos");
  }catch(err){toast("No se ha podido cargar: "+err.message,5000)}
};
function hdr(){$("#btnDatos").textContent=gh()?"⟳ Actualizar":"⟳ Datos";$("#hdDatos").textContent=S.datos?`Datos del ${fd(S.datos.fecha)} · ${S.datos.equipos.length} equipos`:"Sin datos cargados";$("#nav").hidden=!S.datos}

/* ---------- Navegación ---------- */
$$("#nav button").forEach(b=>b.onclick=()=>go(b.dataset.tab));
function go(tab,arg){
  if(S.draft&&S.draft.sucio&&S.tab!==tab&&!confirm("Hay datos sin guardar en esta pantalla. ¿Salir sin guardar?"))return;
  S.draft=null;S.tab=tab;$$("#nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab.split(":")[0]?"page":"false"));
  window.scrollTo(0,0);
  ({admin:vAdmin,bloqueado:vBloqueado,equipos:vEquipos,ficha:vFicha,revision:vRevision,alta:vAlta,mover:vMover,enviar:vEnviar,bienvenida:vBienvenida})[tab](arg);
}

/* ---------- Bienvenida ---------- */
function vBienvenida(){
  $("#app").innerHTML=`<div class="card"><h2>Bienvenida a Izado en el móvil</h2>
  <p>La primera vez hay que cargar el <b>archivo de datos</b> (<span class="code">Izado-datos-movil_${PROGRAMA}.json</span>) que manda Prevención por WhatsApp o correo.</p>
  <ol class="muted"><li>En WhatsApp, descárgalo y guárdalo (Descargas o «WhatsApp Documents»). En iPhone: «Guardar en Archivos».</li><li>Pulsa el botón y elígelo.</li></ol>
  <button class="pri big" id="bCargar">Cargar archivo de datos</button>
  <p class="muted">¿Te han dado una <b>clave de acceso</b>? <button class="sec" id="bConB">Conectar con clave</button></p>
  <p class="muted">Los datos se quedan en este móvil. Después funciona sin cobertura.</p></div>`;
  $("#bCargar").onclick=()=>{$("#inDatos").value="";$("#inDatos").click()};
  $("#bConB").onclick=async()=>{const nombre=(prompt("Nombre de este móvil (por ejemplo Almacén 1):")||"").trim();if(!nombre)return;const token=(prompt("Clave de acceso:")||"").trim();if(!token)return;
    localStorage.setItem("izm-gh",JSON.stringify({nombre,token,repo:REPO_DEF}));await sincronizar(false);if(S.datos){await cargarItems();go("equipos")}else{localStorage.removeItem("izm-gh");hdr()}};
}

/* ---------- Equipos ---------- */
function estTag(e){const s=e.est||"";if(s==="Apto")return `<span class="tag ok">Apto</span>`;if(s==="Cuarentena")return `<span class="tag bad">No apto</span>`;if(s==="Retirado")return `<span class="tag bad">Retirado</span>`;return `<span class="tag warn">${esc(s||"Sin revisar")}</span>`}
function buscar(q,ub){
  const n=q.trim().toUpperCase(), nn=normCode(q), digs=n.replace(/\D/g,"");
  return [...S.eq.values()].filter(e=>{
    if(ub&&(e.ub||NAVE)!==ub)return false; if(!n)return true;
    const hay=[e.c,e.serie,e.ot,e.d,e.t,e.m,e.lote].join(" ").toUpperCase();
    return hay.includes(n)||e.c===nn||(digs.length>=3&&String(e.c).replace(/\D/g,"").endsWith(digs))||(e.ot&&digs.length>=4&&e.ot.includes(digs));
  }).sort((a,b)=>String(a.c).localeCompare(String(b.c),"es",{numeric:true}));
}
function vEquipos(){
  $("#app").innerHTML=`<button class="pri big" id="bEsl">📷 Eslinga con foto</button>
  <div class="card"><label class="f"><span>Buscar por código, nº de serie, ON!Track o texto</span><input id="q" type="search" placeholder="GLL-00454, 04011, EE-677…" value="${esc(S.q)}" autocomplete="off"></label>

/* ---------- Conexión con el repositorio privado de datos (GitHub) ---------- */
function gh(){try{const c=JSON.parse(localStorage.getItem("izm-gh")||"null");return c&&c.token&&c.repo?c:null}catch(e){return null}}
function movilId(){let m=localStorage.getItem("izm-movil-id");if(!m){m=Math.random().toString(36).slice(2,8);localStorage.setItem("izm-movil-id",m)}return m}
function b64utf8(s){const u=new TextEncoder().encode(s);let b="";for(let i=0;i<u.length;i+=0x8000)b+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(b)}
async function ghFetch(path,opt={},raw){const c=gh();const r=await fetch(`https://api.github.com/repos/${c.repo}/contents/${path.split("/").map(encodeURIComponent).join("/")}`,{...opt,cache:"no-store",headers:{Authorization:`Bearer ${c.token}`,Accept:raw?"application/vnd.github.raw+json":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28",...(opt.headers||{})}});
  if(r.status===404)return null;if(r.status===401||r.status===403)throw new Error("La clave no vale o no tiene permiso (pide una nueva a Prevención).");if(!r.ok)throw new Error(`GitHub respondió ${r.status}`);return raw?r.text():r.json()}
const ghPut=(path,b64,msg,sha)=>ghFetch(path,{method:"PUT",body:JSON.stringify(sha?{message:msg,content:b64,sha}:{message:msg,content:b64})});
function deb64utf8(b){const s=atob(String(b||"").replace(/\s/g,""));const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new TextDecoder().decode(u)}
async function ghJSON(path){const r=await ghFetch(path);if(!r||Array.isArray(r))return {sha:null,data:null};return {sha:r.sha,data:JSON.parse(deb64utf8(r.content))}}
async function ghSaveJSON(path,data,msg,sha){return ghPut(path,b64utf8(JSON.stringify(data,null,1)),msg,sha)}
/* ---------- Accesos: registro de móviles, bloqueo y administradores ---------- */
const ACCESOS="accesos.json";
async function leerAccesos(){const r=await ghJSON(ACCESOS);const d=r.data||{};return {sha:r.sha,data:{admins:d.admins||[],bloqueados:d.bloqueados||{}}}}
async function registrarMovil(){
  // Como mucho una vez al día: alta del móvil y última conexión (moviles/<id>.json)
  const yo=movilId(), c=gh(), k="izm-reg-"+hoy();if(localStorage.getItem(k)===c.nombre)return;
  const path=`moviles/${yo}.json`, r=await ghJSON(path), prev=r.data||{};
  await ghSaveJSON(path,{id:yo,nombre:c.nombre,alta:prev.alta||hoy(),ultimaConexion:`${hoy()} ${hora()}`,programa:BUILD},`Móvil ${c.nombre}: conexión`,r.sha);
  localStorage.setItem(k,c.nombre);
}
async function bloquearEste(info){
  // Bloqueado por Prevención: se quitan la clave y los datos de este móvil
  localStorage.removeItem("izm-gh");
  try{await kvSet("datos",null);await kvSet("remotos",[]);for(const i of await itemsAll())await itemDel(i.id)}catch(e){}
  S.datos=null;S.items=[];S.remotos=[];localStorage.setItem("izm-bloqueado",JSON.stringify(info||{}));hdr();go("bloqueado");
}
function vBloqueado(){const i=JSON.parse(localStorage.getItem("izm-bloqueado")||"{}");
  $("#app").innerHTML=`<div class="card"><h2>Móvil bloqueado</h2><p>Prevención ha bloqueado este móvil${i.fecha?` el ${fd(i.fecha)}`:""}. Se han quitado de este móvil los datos de equipos y la clave.</p>
  <p>Si es un error, habla con Prevención: <a class="code" href="mailto:${CORREO_PRL}" style="color:var(--brand-deep)">${CORREO_PRL}</a>. Para volver a usarlo hará falta una clave nueva.</p>
  <button class="sec" id="bOtra">Conectar con una clave nueva</button></div>`;
  $("#bOtra").onclick=()=>{localStorage.removeItem("izm-bloqueado");localStorage.removeItem("izm-movil-id");go("bienvenida")};
}
async function vAdmin(){
  $("#app").innerHTML=`<button class="back" id="bBack">← Enviar</button><div class="card"><h2>Móviles</h2><p class="muted">Cargando…</p></div>`;
  $("#bBack").onclick=()=>go("enviar");
  let acc,movs,envs;
  try{acc=await leerAccesos();movs=((await ghFetch("moviles"))||[]).filter(f=>f.name.endsWith(".json"));envs=((await ghFetch("envios"))||[]).filter(f=>f.name.endsWith(".json"))}
  catch(e){$("#app .card").innerHTML=`<div class="note bad">${esc(e.message)}</div>`;return}
  if(!acc.data.admins.includes(movilId())){$("#app .card").innerHTML=`<div class="note bad">Este móvil no es administrador.</div>`;return}
  const M=[];for(const f of movs){try{M.push((await ghJSON("moviles/"+f.name)).data)}catch(e){}}
  const act={};for(const f of envs){const m=f.name.replace(/\.json$/,"").split("_").pop();(act[m]=act[m]||[]).push(f.name)}
  const ultimo=id=>{const l=(act[id]||[]).sort();return l.length?l[l.length-1].slice(0,10).split("-").reverse().join("/"):"—"};
  const pinta=()=>{const B=acc.data.bloqueados,A=acc.data.admins;
    $("#app").innerHTML=`<button class="back" id="bBack">← Enviar</button>
    <div class="card"><h2>Móviles</h2><p class="muted" style="margin-top:0">Bloquear: el móvil quita su clave y sus datos en cuanto se conecta (con la app abierta, en un minuto como mucho). Para cortarlo del todo, borra también su clave en GitHub.</p>
    <a class="btn sec" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="https://github.com/settings/personal-access-tokens" target="_blank" rel="noopener">Claves en GitHub ↗</a></div>
    <div class="list">${M.sort((a,b)=>String(a.nombre).localeCompare(b.nombre,"es")).map(m=>{const bl=B[m.id], ad=A.includes(m.id), yo=m.id===movilId();
      return `<div class="card"><div><b>${esc(m.nombre)}</b> ${bl?'<span class="tag bad">Bloqueado</span>':'<span class="tag ok">Activo</span>'}${ad?'<span class="tag">Administrador</span>':""}${yo?'<span class="tag warn">Este móvil</span>':""}
      <div class="muted">Alta ${fd(m.alta)} · última conexión ${m.ultimaConexion?fd(m.ultimaConexion.slice(0,10))+" "+esc(m.ultimaConexion.slice(11)):"—"} · ${(act[m.id]||[]).length} envío(s), último ${ultimo(m.id)} · ${esc(m.programa||"")}</div>${bl?`<div class="muted">Bloqueado el ${fd(bl.fecha)}${bl.motivo?": "+esc(bl.motivo):""}</div>`:""}</div>
      ${yo?"":`<div class="row" style="margin-top:8px">${bl?`<button class="sec" data-un="${esc(m.id)}">Desbloquear</button>`:`<button class="pri" data-bl="${esc(m.id)}">Bloquear</button>`}<button data-ad="${esc(m.id)}">${ad?"Quitar administrador":"Hacer administrador"}</button></div>`}</div>`}).join("")||`<p class="muted">Aún no se ha conectado ningún móvil.</p>`}</div>`;
    $("#bBack").onclick=()=>go("enviar");
    const guardar=async(msg)=>{try{const r=await ghSaveJSON(ACCESOS,acc.data,msg,acc.sha);acc.sha=r&&r.content&&r.content.sha;toast("Guardado");pinta()}catch(e){toast("No se ha podido guardar: "+e.message+". Vuelve a abrir el panel.",6000)}};
    const nom=id=>(M.find(m=>m.id===id)||{}).nombre||id;
    $$("[data-bl]").forEach(b=>b.onclick=()=>{const id=b.dataset.bl;const motivo=prompt(`Bloquear «${nom(id)}». Motivo (perdido, cambio de persona…):`,"");if(motivo===null)return;acc.data.bloqueados[id]={fecha:hoy(),motivo:motivo.trim()};acc.data.admins=acc.data.admins.filter(x=>x!==id);guardar(`Bloquear móvil ${nom(id)}`)});
    $$("[data-un]").forEach(b=>b.onclick=()=>{const id=b.dataset.un;if(!confirm(`¿Desbloquear «${nom(id)}»? Ese móvil ya quitó su clave: necesitará una clave nueva.`))return;delete acc.data.bloqueados[id];guardar(`Desbloquear móvil ${nom(id)}`)});
    $$("[data-ad]").forEach(b=>b.onclick=()=>{const id=b.dataset.ad;const A=acc.data.admins;if(A.includes(id))acc.data.admins=A.filter(x=>x!==id);else{if(acc.data.bloqueados[id])return toast("Desbloquéalo antes.");A.push(id)}guardar(`Administradores: ${nom(id)}`)});
  };
  pinta();
}
async function hacermeAdmin(){
  try{const acc=await leerAccesos();if(acc.data.admins.length)return toast("Ya hay administrador. Pídele que te dé permiso desde «Móviles».",5000);
    await registrarMovil();acc.data.admins=[movilId()];await ghSaveJSON(ACCESOS,acc.data,`Administrador: ${gh().nombre}`,acc.sha);localStorage.setItem("izm-admin","1");localStorage.setItem("izm-hayadmin","1");toast("Este móvil es el administrador");vEnviar()}
  catch(e){toast("No se ha podido: "+e.message,5000)}
}
let sincronizando=false;
async function sincronizar(silencio){
  if(!gh()||sincronizando)return;if(!navigator.onLine){if(!silencio)toast("Sin cobertura: se usa lo guardado en el móvil.");return}
  sincronizando=true;const b=$("#btnDatos");b.disabled=true;b.textContent="⟳ …";
  try{
    const acc=await leerAccesos(), yo=movilId();
    if(acc.data.bloqueados[yo]){await bloquearEste(acc.data.bloqueados[yo]);return}
    localStorage.setItem("izm-admin",acc.data.admins.includes(yo)?"1":"");localStorage.setItem("izm-hayadmin",acc.data.admins.length?"1":"");
    try{await registrarMovil()}catch(e){}
    const txt=await ghFetch(DATOS_PATH,{},true);
    if(txt){const d=JSON.parse(txt);if(d.formato==="izado-datos-movil"&&(!S.datos||d.generado!==S.datos.generado)){await kvSet("datos",d);S.datos=d}}
    if(!S.datos)throw new Error("El repositorio aún no tiene el archivo de datos.");
    const inc=new Set(S.datos.incluye||[]);
    let rem=((await kvGet("remotos"))||[]).filter(r=>!inc.has(r.name));
    const lst=(await ghFetch("envios"))||[];const ya=new Set(rem.map(r=>r.name));
    for(const f of lst){if(f.type!=="file"||!f.name.endsWith(".json")||inc.has(f.name)||ya.has(f.name)||f.name.includes("_"+yo+"."))continue;
      try{const e=JSON.parse(await ghFetch("envios/"+f.name,{},true));rem.push({name:f.name,movil:e.movil,items:e.items||[]})}catch(e){}}
    await kvSet("remotos",rem);await cargarItems();hdr();
    await subirCola(true);
    localStorage.setItem("izm-sync",`${fd(hoy())} ${hora()}`);
    if(!silencio)toast(`Actualizado: ${S.eq.size} equipos`);
    if(["equipos","enviar"].includes(S.tab)&&!(S.draft&&S.draft.sucio))go(S.tab);
  }catch(err){if(!silencio)toast("No se ha podido actualizar: "+err.message,5000)}
  finally{sincronizando=false;b.disabled=false;hdr()}
}
async function subirCola(silencio){
  const cola=S.items.filter(i=>!i.enviado&&i.cola);if(!cola.length||!gh()||!navigator.onLine)return;
  try{await subirGH(cola);if(!silencio)toast("Enviado a Prevención")}catch(e){if(!silencio)toast("No se ha podido enviar: "+e.message,5000)}
}
async function subirGH(items){
  const c=gh(), yo=movilId(), d=new Date(), lote=`${hoy()}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`, name=`${lote}_${yo}.json`;
  const out=[];
  for(const it of items){const {enviado,enviadoEl,lote:_l,ts,cola,fotos,...r}=it;const refs=[];
    for(const [n,f] of (fotos||[]).entries()){const fp=`fotos/${lote}_${yo}_${it.id}_${n+1}.jpg`;if(!f.subida){await ghPut(fp,f.data.split(",")[1],`Foto ${fp}`);f.subida=fp;await itemPut(it)}refs.push({tag:f.tag,hora:f.hora,path:f.subida})}
    out.push({...r,ts,fotos:refs})}
  const doc={formato:"izado-movil",version:2,programa:BUILD,datos:S.datos.fecha,lote,movil:c.nombre||yo,movilId:yo,generado:d.toISOString(),items:out};
  await ghPut("envios/"+name,b64utf8(JSON.stringify(doc)),`Envío del móvil ${c.nombre||yo}: ${items.length} cambio(s)`);
  for(const i of items){i.enviado=true;i.cola=false;i.enviadoEl=`${fd(hoy())} ${hora()}`;i.lote=lote;i.envio=name;await itemPut(i)}
  await cargarItems();
}
function mailto(items){const res=(items||[]).map(i=>"- "+etiqueta(i)).join("\n");
  return `mailto:${CORREO_PRL}?subject=${encodeURIComponent(`Izado móvil · ${items.length} cambio(s) · ${fd(hoy())}`)}&body=${encodeURIComponent(`Cambios registrados en Izado desde el móvil${gh()?" (ya subidos al repositorio de datos)":" (adjunto el archivo .json)"}:\n${res}\n`)}`}
function vEnviar(){
  const pend=S.items.filter(i=>!i.enviado).sort((a,b)=>a.ts-b.ts), env=S.items.filter(i=>i.enviado).sort((a,b)=>b.ts-a.ts);
  const nf=pend.reduce((n,i)=>n+(i.fotos||[]).length,0), c=gh();
  $("#app").innerHTML=`<div class="card"><h2>Enviar a Prevención</h2>
   <p style="margin-top:0">Correo de Prevención: <a href="mailto:${CORREO_PRL}" class="code" style="color:var(--brand-deep)">${CORREO_PRL}</a></p>
   ${pend.length?`<p><b>${pend.length}</b> cambio${pend.length===1?"":"s"} sin enviar · ${nf} foto${nf===1?"":"s"}${pend.some(i=>i.cola)?" · <b>en cola</b>: se suben solos al volver la cobertura":""}.</p><button class="pri big" id="bEnv">📤 Enviar a Prevención</button>
   <p class="muted">${c?"Se sube al repositorio de datos de Prevención y los demás móviles lo ven al actualizar. Sin cobertura queda en cola.":`Se abre el menú de compartir del móvil: elige <b>Correo</b> (Gmail, Outlook) y pon como destinatario <b>${CORREO_PRL}</b>, o WhatsApp.`}</p>`:`<p class="note ok" style="margin:0">Todo enviado.</p>`}
   <a class="btn sec" style="display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:8px" href="${esc(mailto(pend.length?pend:env.slice(0,20)))}">✉ Escribir a ${CORREO_PRL}</a></div>
  ${pend.length?`<div class="card"><h3 style="margin-top:0">Sin enviar</h3>${pend.map(i=>`<div class="it"><div class="m"><b>${esc(etiqueta(i))}</b><div class="muted">${fd(i.fecha)} ${esc(i.hora)} · ${(i.fotos||[]).length} foto(s)</div></div><button data-del="${i.id}" aria-label="Borrar">Borrar</button></div>`).join("")}</div>`:""}
  ${env.length?`<div class="card"><h3 style="margin-top:0">Enviado</h3>${env.slice(0,30).map(i=>`<div class="it"><div class="m">${esc(etiqueta(i))}<div class="muted">${fd(i.fecha)} · enviado ${esc(i.enviadoEl||"")}</div></div></div>`).join("")}
   <div class="row" style="margin-top:8px">${c?"":`<button id="bReenv">Volver a enviar lo último</button>`}<button id="bLimpiar">Borrar lo enviado del móvil</button></div></div>`:""}
  <div class="card"><h3 style="margin-top:0">Conexión con Prevención</h3>
   ${c?`<p class="note ok" style="margin:0 0 8px">Conectado a <span class="code">${esc(c.repo)}</span> como <b>${esc(c.nombre||movilId())}</b>. Última actualización: ${esc(localStorage.getItem("izm-sync")||"—")}.</p>
     <div class="row"><button class="sec" id="bSync">⟳ Actualizar ahora</button><button id="bDesc">Desconectar</button></div>`
   :`<p class="muted" style="margin-top:0">Con la clave que da Prevención, este móvil ve al momento lo que mueven los demás y envía sin WhatsApp.</p>
     <div class="grid2"><label class="f span2"><span>Nombre de este móvil</span><input id="cNom" placeholder="Almacén 1" autocomplete="off"></label>
     <label class="f span2"><span>Clave de acceso</span><input id="cTok" type="password" autocomplete="off" placeholder="github_pat_…"></label>
     <label class="f span2"><span>Repositorio</span><input id="cRepo" value="${REPO_DEF}" autocomplete="off"></label></div>
     <div id="cErr"></div><button class="pri big" id="bCon" style="margin-top:8px">Conectar</button>`}
   ${c&&localStorage.getItem("izm-admin")?`<button class="pri big" id="bAdm" style="margin-top:8px">Móviles: accesos y bloqueo</button>`:""}
   ${c&&!localStorage.getItem("izm-hayadmin")?`<button class="sec" id="bSerAdm" style="width:100%;margin-top:8px">Ser el administrador (solo Prevención, la primera vez)</button>`:""}
   <button id="bArch" style="width:100%;margin-top:8px">Cargar archivo de datos a mano</button></div>
  <p class="muted">Programa ${BUILD}. Datos del ${fd(S.datos.fecha)} (${S.datos.programa||"?"}).</p>`;
  $$("[data-del]").forEach(b=>b.onclick=async()=>{if(!confirm("¿Borrar este cambio del móvil? No se enviará."))return;await itemDel(b.dataset.del);await cargarItems();vEnviar()});
  if($("#bEnv"))$("#bEnv").onclick=()=>enviar(pend);
  if($("#bReenv"))$("#bReenv").onclick=()=>{const last=env[0]&&env[0].lote;enviar(S.items.filter(i=>i.lote===last),true)};
  if($("#bLimpiar"))$("#bLimpiar").onclick=async()=>{if(!confirm(`¿Borrar del móvil ${env.length} cambio(s) ya enviados? Los datos de equipos se quedan.`))return;for(const i of env)await itemDel(i.id);await cargarItems();vEnviar()};
  $("#bArch").onclick=()=>{$("#inDatos").value="";$("#inDatos").click()};
  if($("#bSync"))$("#bSync").onclick=()=>sincronizar(false);
  if($("#bAdm"))$("#bAdm").onclick=()=>go("admin");
  if($("#bSerAdm"))$("#bSerAdm").onclick=()=>{if(confirm("¿Hacer administrador a este móvil? Podrá bloquear a los demás. Hazlo solo en el móvil u ordenador de Prevención."))hacermeAdmin()};
  if($("#bDesc"))$("#bDesc").onclick=()=>{if(!confirm("¿Desconectar este móvil? Lo hecho se queda; para volver a conectar hará falta la clave."))return;localStorage.removeItem("izm-gh");hdr();vEnviar()};
  if($("#bCon"))$("#bCon").onclick=async()=>{const cfg={nombre:$("#cNom").value.trim(),token:$("#cTok").value.trim(),repo:$("#cRepo").value.trim()||REPO_DEF};
    if(!cfg.nombre||!cfg.token){$("#cErr").innerHTML=`<div class="note bad">Pon el nombre del móvil y la clave.</div>`;return}
    localStorage.setItem("izm-gh",JSON.stringify(cfg));
    try{const r=await ghFetch("");if(r===null)throw new Error("No se encuentra el repositorio.");toast("Conectado");hdr();await sincronizar(true);vEnviar()}
    catch(e){localStorage.removeItem("izm-gh");$("#cErr").innerHTML=`<div class="note bad">${esc(e.message)}</div>`}};
}
async function enviar(items,reenvio){
  if(!items.length)return;
  if(gh()&&!reenvio){
    for(const i of items){i.cola=true;await itemPut(i)}
    if(!navigator.onLine){await cargarItems();toast("Sin cobertura: queda en cola y se envía sola al volver la señal.",5000);return vEnviar()}
    const b=$("#bEnv");if(b){b.disabled=true;b.textContent="Enviando…"}
    try{await subirGH(items);toast(`Enviado a Prevención (${items.length})`)}catch(e){toast("No se ha podido enviar; queda en cola: "+e.message,6000);await cargarItems()}
    return vEnviar();
  }
  const lote=reenvio?items[0].lote:`${hoy()}_${hora().replace(":","")}`;
  const doc={formato:"izado-movil",version:1,programa:BUILD,datos:S.datos.fecha,lote,generado:new Date().toISOString(),
    items:items.map(({enviado,enviadoEl,lote,ts,...r})=>({...r,fotos:(r.fotos||[]).map(({mini,...f})=>f)}))};
  const name=`izado-movil_${lote}.json`, blob=new Blob([JSON.stringify(doc)],{type:"application/json"});
  let ok=false;
  try{const file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:`Izado · envío del móvil · Para: ${CORREO_PRL}`,text:`Para: ${CORREO_PRL}\nIzado: ${items.length} cambio(s) del móvil (${fd(hoy())})`});ok=true}
  }catch(e){if(e&&e.name==="AbortError"){toast("Envío cancelado");return}}
  if(!ok){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast(`Descargado ${name}. Mándalo a ${CORREO_PRL}.`,6000);ok=true}
  if(ok&&!reenvio){for(const i of items){i.enviado=true;i.enviadoEl=`${fd(hoy())} ${hora()}`;i.lote=lote;await itemPut(i)}await cargarItems();vEnviar()}
}
window.addEventListener("beforeunload",e=>{if(S.items.some(i=>!i.enviado)||(S.draft&&S.draft.sucio)){e.preventDefault();e.returnValue=""}});

/* ---------- Arranque ---------- */
(async()=>{
  if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
  try{S.datos=await kvGet("datos")}catch(e){}
  hdr();
  if(localStorage.getItem("izm-bloqueado")&&!gh())return go("bloqueado");
  if(!S.datos&&gh())await sincronizar(true);
  if(!S.datos)return go("bienvenida");
  await cargarItems();go("equipos");
  if(gh())sincronizar(true);
  window.addEventListener("online",()=>setTimeout(()=>sincronizar(true),1500));
  setInterval(()=>{if(document.visibilityState==="visible")sincronizar(true)},60000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")sincronizar(true)});
})();
</script>
